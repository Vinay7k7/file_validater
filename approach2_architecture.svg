<svg viewBox="0 0 1400 780" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b4a5a"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f1b2b" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="cloudBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#dcebf7"/>
    </linearGradient>
    <linearGradient id="localBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1f4"/>
      <stop offset="100%" stop-color="#e3e8ec"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="780" fill="#ffffff"/>

  <text x="700" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#173a5e">Approach 2 - Cloud AI-Driven Orchestration (Local Execution)</text>
  <text x="700" y="72" text-anchor="middle" font-size="15" fill="#5a6b7a">A single orchestrator script offloads validation logic to the GitHub Copilot API</text>

  <!-- Cloud panel -->
  <rect x="330" y="105" width="740" height="150" rx="18" fill="url(#cloudBg)" stroke="#b7d3ea" stroke-width="1.5" filter="url(#shadow2)"/>
  <text x="700" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#173a5e">Cloud</text>

  <g filter="url(#shadow2)">
    <rect x="560" y="155" width="280" height="75" rx="12" fill="#1f2937" stroke="#0f1720" stroke-width="1.5"/>
    <circle cx="600" cy="192" r="16" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <path d="M600 178 a14 14 0 0 1 0 28" fill="none" stroke="#ffffff" stroke-width="2.2"/>
    <text x="700" y="198" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">GitHub Copilot API</text>
  </g>
  <text x="700" y="248" text-anchor="middle" font-size="11.5" fill="#5a6b7a">Receives the prompt, performs the validation, and returns a structured result</text>

  <!-- arrow cloud to orchestrator -->
  <path d="M700 255 L700 300" stroke="#3b4a5a" stroke-width="2.2" fill="none" marker-end="url(#arrow2)"/>
  <text x="620" y="285" font-size="11" fill="#3b4a5a" font-weight="600">API request</text>
  <text x="770" y="285" font-size="11" fill="#3b4a5a" font-weight="600">API response</text>

  <!-- Local panel -->
  <rect x="50" y="300" width="1300" height="440" rx="18" fill="url(#localBg)" stroke="#c3ccd4" stroke-width="1.5" filter="url(#shadow2)"/>
  <rect x="50" y="300" width="1300" height="46" rx="18" fill="#4a5a68"/>
  <rect x="50" y="330" width="1300" height="16" fill="#4a5a68"/>
  <text x="700" y="329" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Local - Single Unified Orchestrator Script</text>

  <!-- inputs -->
  <g filter="url(#shadow2)">
    <rect x="120" y="400" width="140" height="90" rx="10" fill="#ffffff" stroke="#7fa8c9" stroke-width="1.5"/>
    <rect x="135" y="415" width="55" height="6" rx="2" fill="#2f6fa8"/>
    <rect x="135" y="428" width="95" height="5" rx="2" fill="#c3d6e5"/>
    <rect x="135" y="438" width="75" height="5" rx="2" fill="#c3d6e5"/>
    <rect x="135" y="448" width="85" height="5" rx="2" fill="#c3d6e5"/>
    <text x="190" y="478" text-anchor="middle" font-size="13" font-weight="600" fill="#173a5e">rules.yaml</text>
  </g>

  <g filter="url(#shadow2)">
    <rect x="120" y="530" width="140" height="90" rx="10" fill="#ffffff" stroke="#8a95a0" stroke-width="1.5"/>
    <rect x="135" y="545" width="55" height="6" rx="2" fill="#4a5a68"/>
    <rect x="135" y="558" width="95" height="5" rx="2" fill="#cfd6dc"/>
    <rect x="135" y="568" width="75" height="5" rx="2" fill="#cfd6dc"/>
    <rect x="135" y="578" width="85" height="5" rx="2" fill="#cfd6dc"/>
    <text x="190" y="608" text-anchor="middle" font-size="13" font-weight="600" fill="#173a5e">Test.sql</text>
  </g>

  <!-- orchestrator script -->
  <g filter="url(#shadow2)">
    <rect x="450" y="440" width="260" height="160" rx="14" fill="#ffffff" stroke="#2f6fa8" stroke-width="2.5"/>
    <rect x="470" y="460" width="90" height="8" rx="3" fill="#2f6fa8"/>
    <text x="580" y="500" text-anchor="middle" font-size="15" font-weight="700" fill="#173a5e">sql_validator.py</text>
    <text x="470" y="525" font-size="11.5" fill="#3b4a5a">- collects SQL file +</text>
    <text x="482" y="540" font-size="11.5" fill="#3b4a5a">rules.yaml</text>
    <text x="470" y="558" font-size="11.5" fill="#3b4a5a">- formats them into a</text>
    <text x="482" y="573" font-size="11.5" fill="#3b4a5a">prompt for the API</text>
    <text x="470" y="591" font-size="11.5" fill="#3b4a5a">- parses the response</text>
  </g>

  <path d="M260 440 L450 480" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>
  <path d="M260 575 L450 540" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>

  <!-- terminal -->
  <g filter="url(#shadow2)">
    <rect x="450" y="630" width="260" height="60" rx="8" fill="#111820"/>
    <text x="470" y="666" font-size="12.5" fill="#8fd48f" font-family="Consolas, monospace">$ python sql_validator.py Test.sql</text>
  </g>

  <!-- orchestrator to cloud -->
  <path d="M700 440 L700 260" stroke="#3b4a5a" stroke-width="2.2" fill="none" stroke-dasharray="6,4"/>

  <!-- output -->
  <g filter="url(#shadow2)">
    <rect x="900" y="400" width="380" height="290" rx="12" fill="#ffffff" stroke="#8a95a0" stroke-width="1.5"/>
    <text x="1090" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#26313b">Validation Output</text>
    <text x="920" y="458" font-size="12" fill="#3b4a5a">- Result returned by the API is</text>
    <text x="932" y="474" font-size="12" fill="#3b4a5a">printed by the orchestrator</text>
    <text x="920" y="500" font-size="12" fill="#3b4a5a">- PASS / FAIL with reasoning for</text>
    <text x="932" y="516" font-size="12" fill="#3b4a5a">each rule violation</text>
    <text x="920" y="542" font-size="12" fill="#3b4a5a">- No local validation logic to</text>
    <text x="932" y="558" font-size="12" fill="#3b4a5a">maintain - rules interpreted by</text>
    <text x="932" y="574" font-size="12" fill="#3b4a5a">the API each run</text>
  </g>
  <path d="M710 500 L900 500" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow2)"/>

  <!-- benefit note -->
  <g filter="url(#shadow2)">
    <rect x="900" y="620" width="380" height="90" rx="10" fill="#eafaf0" stroke="#8fd4a8" stroke-width="1.5"/>
    <text x="920" y="645" font-size="12.5" font-weight="700" fill="#1e6b3a">Key Benefit</text>
    <text x="920" y="665" font-size="11.5" fill="#2a4a35">One script handles every SQL entity</text>
    <text x="920" y="680" font-size="11.5" fill="#2a4a35">type - no per-rule Python files to maintain</text>
  </g>

  <text x="700" y="760" text-anchor="middle" font-size="11.5" fill="#8a95a0">AI performs validation at run time via the GitHub Copilot API - no hardcoded rule logic locally.</text>
</svg>
