<svg viewBox="0 0 1400 820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b4a5a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f1b2b" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="devBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eaf3fb"/>
      <stop offset="100%" stop-color="#dcebf7"/>
    </linearGradient>
    <linearGradient id="execBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef1f4"/>
      <stop offset="100%" stop-color="#e3e8ec"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#ffffff"/>

  <text x="700" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#173a5e">Approach 1 - AI-Assisted Local Development (Local Execution)</text>
  <text x="700" y="72" text-anchor="middle" font-size="15" fill="#5a6b7a">Development Phase (AI code generation) then Execution Phase (manual run on Linux server)</text>

  <rect x="50" y="110" width="600" height="650" rx="18" fill="url(#devBg)" stroke="#b7d3ea" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="110" width="600" height="46" rx="18" fill="#2f6fa8"/>
  <rect x="50" y="140" width="600" height="16" fill="#2f6fa8"/>
  <text x="350" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1. Development Phase - Code Generation</text>

  <g>
    <circle cx="350" cy="220" r="34" fill="#ffffff" stroke="#2f6fa8" stroke-width="2"/>
    <path d="M350 200 l6 12 12 6 -12 6 -6 12 -6 -12 -12 -6 12 -6 z" fill="#2f6fa8"/>
    <text x="350" y="272" text-anchor="middle" font-size="14" font-weight="600" fill="#173a5e">GitHub Copilot (VS Code)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="100" y="310" width="150" height="80" rx="10" fill="#ffffff" stroke="#7fa8c9" stroke-width="1.5"/>
    <rect x="115" y="325" width="60" height="6" rx="2" fill="#2f6fa8"/>
    <rect x="115" y="337" width="90" height="5" rx="2" fill="#9db8cc"/>
    <rect x="115" y="347" width="70" height="5" rx="2" fill="#9db8cc"/>
    <rect x="115" y="357" width="80" height="5" rx="2" fill="#9db8cc"/>
    <text x="175" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#173a5e">rules.yaml</text>
  </g>
  <text x="270" y="342" font-size="11.5" fill="#3b4a5a">Defines validation</text>
  <text x="270" y="356" font-size="11.5" fill="#3b4a5a">rules per SQL</text>
  <text x="270" y="370" font-size="11.5" fill="#3b4a5a">entity type</text>

  <path d="M175 310 L175 280 Q175 262 250 250" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="470" y="200" width="150" height="180" rx="10" fill="#ffffff" stroke="#7fa8c9" stroke-width="1.5"/>
    <text x="545" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#173a5e">Developer prompts</text>
    <text x="545" y="238" text-anchor="middle" font-size="12.5" font-weight="700" fill="#173a5e">Copilot with rules</text>
    <text x="490" y="262" font-size="11" fill="#3b4a5a">A dedicated script</text>
    <text x="490" y="278" font-size="11" fill="#3b4a5a">is generated for</text>
    <text x="490" y="294" font-size="11" fill="#3b4a5a">every SQL entity</text>
    <text x="490" y="310" font-size="11" fill="#3b4a5a">type (DDL, ALTER,</text>
    <text x="490" y="326" font-size="11" fill="#3b4a5a">etc.)</text>
    <text x="490" y="350" font-size="11" fill="#c0392b" font-style="italic">Manual updates</text>
    <text x="490" y="365" font-size="11" fill="#c0392b" font-style="italic">needed if rules change</text>
  </g>
  <path d="M384 220 L470 220" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <text x="350" y="425" text-anchor="middle" font-size="14" font-weight="700" fill="#173a5e">Generated Python Scripts (one per SQL entity)</text>

  <g filter="url(#shadow)">
    <rect x="100" y="450" width="130" height="90" rx="10" fill="#ffffff" stroke="#7fa8c9" stroke-width="1.5"/>
    <rect x="115" y="465" width="50" height="6" rx="2" fill="#5a8fb8"/>
    <rect x="115" y="478" width="90" height="5" rx="2" fill="#c3d6e5"/>
    <rect x="115" y="488" width="70" height="5" rx="2" fill="#c3d6e5"/>
    <text x="165" y="530" text-anchor="middle" font-size="11" font-weight="600" fill="#173a5e">sql_validator_ddl.py</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="245" y="450" width="130" height="90" rx="10" fill="#ffffff" stroke="#2f6fa8" stroke-width="2.5"/>
    <rect x="260" y="465" width="50" height="6" rx="2" fill="#2f6fa8"/>
    <rect x="260" y="478" width="90" height="5" rx="2" fill="#c3d6e5"/>
    <rect x="260" y="488" width="70" height="5" rx="2" fill="#c3d6e5"/>
    <text x="310" y="530" text-anchor="middle" font-size="11" font-weight="700" fill="#173a5e">sql_validator_alter.py</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="390" y="450" width="130" height="90" rx="10" fill="#ffffff" stroke="#7fa8c9" stroke-width="1.5"/>
    <rect x="405" y="465" width="50" height="6" rx="2" fill="#5a8fb8"/>
    <rect x="405" y="478" width="90" height="5" rx="2" fill="#c3d6e5"/>
    <rect x="405" y="488" width="70" height="5" rx="2" fill="#c3d6e5"/>
    <text x="455" y="530" text-anchor="middle" font-size="11" font-weight="600" fill="#173a5e">sql_validator_x.py</text>
  </g>

  <path d="M350 380 L165 450" stroke="#3b4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M350 380 L310 450" stroke="#3b4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M350 380 L455 450" stroke="#3b4a5a" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="100" y="580" width="500" height="150" rx="10" fill="#fff8ec" stroke="#e0c184" stroke-width="1.5"/>
    <text x="120" y="605" font-size="13" font-weight="700" fill="#8a6417">Developer Responsibility (Maintenance)</text>
    <text x="120" y="630" font-size="12" fill="#5a4a2a">- Every new validation rule requires editing the</text>
    <text x="132" y="648" font-size="12" fill="#5a4a2a">matching Python file by hand</text>
    <text x="120" y="672" font-size="12" fill="#5a4a2a">- No shared/central logic - scripts grow and</text>
    <text x="132" y="690" font-size="12" fill="#5a4a2a">drift independently over time</text>
    <text x="120" y="714" font-size="12" fill="#5a4a2a">- Scales poorly as SQL entity types increase</text>
  </g>

  <path d="M650 435 L760 435" stroke="#3b4a5a" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="420" text-anchor="middle" font-size="11.5" fill="#3b4a5a" font-weight="600">deploy /</text>
  <text x="705" y="450" text-anchor="middle" font-size="11.5" fill="#3b4a5a" font-weight="600">copy script</text>

  <rect x="760" y="110" width="590" height="650" rx="18" fill="url(#execBg)" stroke="#c3ccd4" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="760" y="110" width="590" height="46" rx="18" fill="#4a5a68"/>
  <rect x="760" y="140" width="590" height="16" fill="#4a5a68"/>
  <text x="1055" y="139" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2. Execution Phase - Local Run</text>

  <g filter="url(#shadow)">
    <rect x="890" y="200" width="340" height="140" rx="12" fill="#3c4a56" stroke="#26313b" stroke-width="1.5"/>
    <text x="1060" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Our Linux Server</text>
    <circle cx="960" cy="270" r="4" fill="#7ee787"/>
    <circle cx="980" cy="270" r="4" fill="#7ee787"/>
    <circle cx="1000" cy="270" r="4" fill="#7ee787"/>
    <rect x="920" y="290" width="280" height="34" rx="6" fill="#111820"/>
    <text x="935" y="312" font-size="12" fill="#8fd48f" font-family="Consolas, monospace">$ python sql_validator_alter.py Test.sql</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1230" y="200" width="120" height="90" rx="10" fill="#ffffff" stroke="#8a95a0" stroke-width="1.5"/>
    <rect x="1245" y="215" width="50" height="6" rx="2" fill="#4a5a68"/>
    <rect x="1245" y="228" width="90" height="5" rx="2" fill="#cfd6dc"/>
    <rect x="1245" y="238" width="70" height="5" rx="2" fill="#cfd6dc"/>
    <rect x="1245" y="248" width="80" height="5" rx="2" fill="#cfd6dc"/>
    <text x="1290" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#26313b">Test.sql</text>
  </g>
  <path d="M1229 255 L1130 255" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>
  <text x="1178" y="245" text-anchor="middle" font-size="10.5" fill="#3b4a5a">input file</text>

  <path d="M760 285 L890 260" stroke="#3b4a5a" stroke-width="1.8" fill="none" stroke-dasharray="5,4"/>

  <g filter="url(#shadow)">
    <rect x="890" y="400" width="340" height="130" rx="12" fill="#ffffff" stroke="#8a95a0" stroke-width="1.5"/>
    <text x="1060" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#26313b">Validation Output</text>
    <text x="910" y="452" font-size="11.5" fill="#3b4a5a">- PASS / FAIL result printed to console</text>
    <text x="910" y="472" font-size="11.5" fill="#3b4a5a">- Errors reference the specific SQL rule</text>
    <text x="910" y="492" font-size="11.5" fill="#3b4a5a">- No central log or dashboard - output is</text>
    <text x="922" y="510" font-size="11.5" fill="#3b4a5a">local to each terminal run</text>
  </g>
  <path d="M1060 340 L1060 400" stroke="#3b4a5a" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="890" y="560" width="340" height="170" rx="10" fill="#fdecea" stroke="#e6a49a" stroke-width="1.5"/>
    <text x="910" y="585" font-size="13" font-weight="700" fill="#a83226">Key Limitation</text>
    <text x="910" y="610" font-size="12" fill="#6b2a22">- Manual command per SQL entity type</text>
    <text x="922" y="628" font-size="12" fill="#6b2a22">e.g. sql_validator_alter.py &lt;file&gt;</text>
    <text x="910" y="650" font-size="12" fill="#6b2a22">- Requires local Python + VS Code setup</text>
    <text x="910" y="672" font-size="12" fill="#6b2a22">- Not automated - no CI/CD trigger,</text>
    <text x="922" y="690" font-size="12" fill="#6b2a22">runs only when a developer executes it</text>
    <text x="910" y="712" font-size="12" fill="#6b2a22">- Doesn't scale with growing rule sets</text>
  </g>

  <text x="700" y="800" text-anchor="middle" font-size="11.5" fill="#8a95a0">AI is used only at development time to author scripts - execution itself is fully manual and local.</text>
</svg>
